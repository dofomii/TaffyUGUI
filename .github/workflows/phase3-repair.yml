name: phase3-repair-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase3-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Repair golden fixture defaults
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          verification = Path("native/tests/native_verification.rs")
          text = verification.read_text(encoding="utf-8")
          old = "    style.position = TuPosition::Relative as i32;\n    style.flex_direction = TuFlexDirection::Row as i32;\n"
          new = "    style.position = TuPosition::Relative as i32;\n    // TuValueKind::Auto is numerically zero, so a zeroed TuStyle would otherwise\n    // create four auto margins instead of the CSS/Taffy default zero margins.\n    style.margin_left = px(0.0);\n    style.margin_right = px(0.0);\n    style.margin_top = px(0.0);\n    style.margin_bottom = px(0.0);\n    style.flex_direction = TuFlexDirection::Row as i32;\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one base_style insertion point, found {text.count(old)}")
          verification.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Canonical Rust formatting
        run: cargo fmt --manifest-path native/Cargo.toml --all
      - name: Commit repaired golden fixture
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/tests
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No repair changes were needed."
            exit 0
          fi
          git commit -m "Fix Phase 3 golden style defaults"
          git push origin HEAD:main
