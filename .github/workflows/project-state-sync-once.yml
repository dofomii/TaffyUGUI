name: project-state-sync-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/project-state-sync-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Synchronize README, tracker, and ABI RC documentation
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new)

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old_status = "**Active native engine development.** Phase 0 — Rust Project and Toolchain Foundation is complete. The formal tracker remains in **Phase 1 stabilization — Complete Rust/Taffy 0.13 Engine** because the mandatory Rust verification gate cannot run in the current detached environment. By explicit project-owner direction, the complete **Phase 2 production C ABI candidate implementation has also been prepared locally** without formally advancing the phase gate. User-facing Unity feature development remains intentionally gated until the native verification, cross-platform ABI release candidate, managed ABI conformance, final ABI v1 freeze, and native artifact rebuild are complete."
          new_status = "**Active native engine development.** Phases 0–3 are complete and verified: the Rust/Taffy 0.13 engine, production fixed-width C ABI, generated C/C++ header, golden/safety/lifecycle suites, host builds, true Rust 1.82 MSRV lane, cbindgen drift check, and linked C11/C++17 smoke tests are green. The native interface is now locked as **ABI-v1-RC (version 1, stage 1)**. **Phase 4 — Cross-Platform Native Compilation is active.** User-facing Unity feature development remains intentionally gated until cross-platform RC payload staging, managed ABI conformance, final ABI v1 freeze, and the final native rebuild are complete."
          text = replace_once(text, old_status, new_status, "README status")
          text = replace_once(
              text,
              "- current production `tu_*` ABI candidate reports version `0` while unfrozen; final ABI v1 is frozen only after managed conformance testing.",
              "- current production `tu_*` interface is **ABI-v1-RC**, version `1`, stage `1`; final ABI v1 is frozen only after managed conformance testing in Phase 6.",
              "README ABI bullet",
          )
          readme.write_text(text, encoding="utf-8")

          tracker = Path("docs/TASK_TRACKER.md")
          text = tracker.read_text(encoding="utf-8")
          old_current = """**Current phase:** Phase 1 — Complete Rust/Taffy 0.13 Engine  
**Phase state:** IN PROGRESS  
**Current dependency baseline:** Taffy `0.13.0` exact pin  
**Project MSRV:** Rust `1.82.0`  
**Pinned normal/release toolchain:** Rust `1.97.1`  
**Bootstrap ABI:** `0` (explicitly unstable)  
**Unity feature development:** PAUSED  
**NEXT TASK:** **P1.1 — implement the production context registry/arena.**"""
          new_current = """**Current phase:** Phase 4 — Cross-Platform Native Compilation (ABI RC)  
**Phase state:** IN PROGRESS  
**Current dependency baseline:** Taffy `0.13.0` exact pin  
**Project MSRV:** Rust `1.82.0`  
**Pinned normal/release toolchain:** Rust `1.97.1`  
**Native ABI:** **ABI-v1-RC — version `1`, stage `1`**  
**Phase 3 evidence:** canonical `verify-abi-rc`, Linux/Windows/macOS host lanes, true Rust 1.82 MSRV, generated-header diff, and linked C11/C++17 smoke tests are green.  
**Unity feature development:** PAUSED until the Phase 6 ABI-v1/final-native-payload gate  
**NEXT TASK:** **Complete Phase 4 target validation: make every required platform-family build/staging lane green without weakening the ABI or hiding unsupported toolchains.**"""
          text = replace_once(text, old_current, new_current, "tracker current state")

          summary_replacements = {
              "| 1 | Complete Rust/Taffy Engine | Full intended Taffy 0.13 native layout surface works without Unity | **IN PROGRESS** |": "| 1 | Complete Rust/Taffy Engine | Full intended Taffy 0.13 native layout surface works without Unity | **COMPLETE** |",
              "| 2 | Production C ABI Candidate | Safe fixed-width C ABI exposes the complete native engine | NOT STARTED |": "| 2 | Production C ABI Candidate | Safe fixed-width C ABI exposes the complete native engine | **COMPLETE** |",
              "| 3 | Native Verification + ABI RC | Golden/safety/header/smoke tests prove an ABI release candidate | NOT STARTED |": "| 3 | Native Verification + ABI RC | Golden/safety/header/smoke tests prove an ABI release candidate | **COMPLETE** |",
              "| 4 | Cross-Platform Native Compilation | ABI RC builds for Windows/macOS/Android/iOS/WebGL | NOT STARTED |": "| 4 | Cross-Platform Native Compilation | ABI RC builds for Windows/macOS/Android/iOS/WebGL | **IN PROGRESS** |",
              "# Phase 1 — Complete Rust/Taffy 0.13 Engine\n\n**State:** IN PROGRESS": "# Phase 1 — Complete Rust/Taffy 0.13 Engine\n\n**State:** COMPLETE",
              "# Phase 2 — Production C ABI Candidate and Safety\n\n**State:** NOT STARTED": "# Phase 2 — Production C ABI Candidate and Safety\n\n**State:** COMPLETE",
              "# Phase 3 — Native Verification and ABI Release-Candidate Lock\n\n**State:** NOT STARTED": "# Phase 3 — Native Verification and ABI Release-Candidate Lock\n\n**State:** COMPLETE",
              "# Phase 4 — Cross-Platform Native Compilation (ABI RC)\n\n**State:** NOT STARTED": "# Phase 4 — Cross-Platform Native Compilation (ABI RC)\n\n**State:** IN PROGRESS",
          }
          for old, new in summary_replacements.items():
              text = replace_once(text, old, new, old[:40])

          for phase, next_phase in (("1", "2"), ("2", "3"), ("3", "4")):
              pattern = rf"(# Phase {phase} .*?)(?=\n---\n\n# Phase {next_phase} )"
              match = re.search(pattern, text, flags=re.DOTALL)
              if not match:
                  raise SystemExit(f"could not isolate Phase {phase}")
              block = match.group(1)
              block = re.sub(rf"- \[ \] \*\*P{phase}\.", f"- [x] **P{phase}.", block)
              if phase == "1":
                  block = block.replace("**P1.1 — NEXT TASK**", "**P1.1**")
                  block = block.replace("### Phase 1 gate\n", "### Phase 1 gate — PASSED\n")
              elif phase == "2":
                  block = block.replace("### Phase 2 gate\n", "### Phase 2 gate — PASSED\n")
              elif phase == "3":
                  block = block.replace("- [x] **P3.12** lock interface", "- [x] **P3.12** lock interface")
                  if "### Phase 3 gate" in block:
                      block = block.replace("### Phase 3 gate\n", "### Phase 3 gate — PASSED\n")
                  else:
                      block += "\n\n### Phase 3 gate — PASSED\n\n`python build/build.py verify-abi-rc` passes with ABI version/stage `1/1`, including golden/safety/lifecycle tests, generated-header drift verification, locked release build, and linked C11/C++17 smoke executables.\n"
              text = text[:match.start(1)] + block + text[match.end(1):]

          for task in ("P4.1", "P4.2", "P4.3", "P4.4", "P4.5", "P4.7", "P4.8"):
              text, count = re.subn(rf"- \[ \] \*\*{re.escape(task)}\*\*", f"- [x] **{task}**", text, count=1)
              if count != 1:
                  raise SystemExit(f"could not mark {task} complete")

          phase4_heading = "### Phase 4 gate\n\nEvery required platform-family artifact compiles with identical ABI RC symbols/version and passes host/static/link verification appropriate to that target."
          phase4_replacement = "### Phase 4 gate — OPEN\n\nEvery required platform-family artifact must compile with identical ABI RC symbols/version and pass host/static/link verification appropriate to that target. macOS universal has already passed and produced verified CI artifacts; the remaining target lanes stay unchecked until their real toolchains pass."
          text = replace_once(text, phase4_heading, phase4_replacement, "Phase 4 gate")
          tracker.write_text(text, encoding="utf-8")

          abi = Path("docs/ABI_CANDIDATE.md")
          text = abi.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "This document describes the **Phase 2 ABI candidate** implemented by `native/src/ffi.rs` and mirrored in `include/taffy_ugui.h`.\n\nIt is not the final ABI v1 promise. The interface remains an ABI candidate until the Phase 3 native verification gate locks an ABI-v1-RC and Phase 6 managed conformance later proves the final binary contract.",
              "This document describes the production C ABI implemented by `native/src/ffi.rs` and mirrored by the authoritative cbindgen output in `include/taffy_ugui.h`.\n\nThe Phase 3 native verification gate has passed and this interface is now locked as **ABI-v1-RC**. It is still not the final ABI v1 promise: Phase 6 managed conformance must prove the P/Invoke binary contract before final ABI v1 is frozen and all native artifacts are rebuilt.",
              "ABI intro",
          )
          text = replace_once(
              text,
              "## Candidate version handshake\n\n`tu_get_abi_version()` remains `0` while the contract is an unfrozen candidate, and `tu_get_abi_stage()` reports the candidate stage. Callers must also inspect `tu_get_capabilities()` before assuming an optional feature is available.\n\nPhase 3 may lock this interface as an ABI-v1 release candidate after native verification; the final ABI v1 designation is owned by the Phase 6 managed-conformance freeze.",
              "## ABI-v1-RC version handshake\n\n`tu_get_abi_version()` now reports `1` and `tu_get_abi_stage()` reports `1`, identifying the verified **ABI-v1-RC** contract used for Phase 4 platform compilation. Callers must also inspect `tu_get_capabilities()` before assuming an optional feature is available.\n\nThe RC lock means Phase 4 native artifacts must share this exact binary contract. The final ABI v1 designation is still owned by the Phase 6 managed-conformance freeze and subsequent full native rebuild.",
              "ABI handshake",
          )
          abi.write_text(text, encoding="utf-8")
          PY
      - name: Validate synchronized docs
        run: |
          git diff --check
          grep -q 'Phase 4 — Cross-Platform Native Compilation' README.md
          grep -q 'ABI-v1-RC' docs/TASK_TRACKER.md
          grep -q 'ABI-v1-RC version handshake' docs/ABI_CANDIDATE.md
      - name: Commit synchronized project state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/TASK_TRACKER.md docs/ABI_CANDIDATE.md
          git diff --cached --check
          git commit -m "Synchronize project state at Phase 4 start"
          git push origin HEAD:main
