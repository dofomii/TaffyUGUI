name: native-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install pinned cbindgen
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cbindgen --version 0.29.2 --locked
      - name: Canonical Phase 3 ABI-RC verification driver
        if: matrix.os == 'ubuntu-latest'
        run: python build/build.py verify-abi-rc
      - name: Clippy
        if: matrix.os != 'ubuntu-latest'
        run: cargo clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --locked --manifest-path native/Cargo.toml
      - name: Release build
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --locked --manifest-path native/Cargo.toml --release

  msrv:
    name: rust (MSRV 1.82.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
      - name: Check MSRV
        run: cargo +1.82.0 check --locked --manifest-path native/Cargo.toml --all-targets
      - name: Test MSRV
        run: cargo +1.82.0 test --locked --manifest-path native/Cargo.toml

  abi-rc-state:
    name: ABI-v1-RC state
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.rc.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
      - id: rc
        name: Detect ABI-v1-RC lock
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          text = Path("native/src/version.rs").read_text(encoding="utf-8")
          abi = re.search(r"TU_ABI_VERSION: u32 = (\d+);", text)
          stage = re.search(r"TU_ABI_STAGE: u32 = (\d+);", text)
          enabled = bool(abi and stage and abi.group(1) == "1" and stage.group(1) == "1")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"enabled={'true' if enabled else 'false'}\n")
          print("ABI-v1-RC platform lanes enabled:", enabled)
          PY

  phase4-windows-x64:
    name: Phase 4 windows-x64
    needs: [rust, abi-rc-state]
    if: needs.abi-rc-state.outputs.enabled == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
      - run: python build/build.py native windows-x64
      - run: python build/build.py verify-native windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-x64
          path: dist/native/windows/x86_64
          if-no-files-found: error

  phase4-macos:
    name: Phase 4 macos universal
    needs: [rust, abi-rc-state]
    if: needs.abi-rc-state.outputs.enabled == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: python build/build.py native macos
      - run: python build/build.py verify-native macos-arm64 macos-x64
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: dist/native/macos
          if-no-files-found: error

  phase4-ios-arm64:
    name: Phase 4 ios-arm64
    needs: [rust, abi-rc-state]
    if: needs.abi-rc-state.outputs.enabled == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-ios
          components: llvm-tools-preview
      - run: python build/build.py native ios-arm64
      - run: python build/build.py verify-native ios-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: native-ios-arm64
          path: dist/native/ios/arm64
          if-no-files-found: error

  phase4-android-arm64:
    name: Phase 4 android-arm64
    needs: [rust, abi-rc-state]
    if: needs.abi-rc-state.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
      - name: Install Unity 2021.3 NDK r21d
        run: sdkmanager "ndk;21.3.6528147"
      - name: Build Android ARM64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/21.3.6528147
        run: python build/build.py native android-arm64
      - run: python build/build.py verify-native android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: native-android-arm64
          path: dist/native/android/arm64-v8a
          if-no-files-found: error

  phase4-webgl:
    name: Phase 4 webgl
    needs: [rust, abi-rc-state]
    if: needs.abi-rc-state.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-emscripten
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 2.0.19
          actions-cache-folder: emsdk-cache
      - run: python build/build.py native webgl
      - run: python build/build.py verify-native webgl
      - uses: actions/upload-artifact@v4
        with:
          name: native-webgl
          path: dist/native/webgl/wasm32
          if-no-files-found: error
