name: native-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path native/Cargo.toml
      - name: Release build
        run: cargo build --manifest-path native/Cargo.toml --release
