name: phase4-platform-fix-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/project-state-sync-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Patch Android r21d unwind search and iOS archive verification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("build/build.py")
          text = path.read_text(encoding="utf-8")

          old = '        existing_rustflags = env.get("RUSTFLAGS", "").strip()\n        env["RUSTFLAGS"] = f"{existing_rustflags} -C panic=abort".strip()\n        env["TAFFY_UGUI_PANIC_STRATEGY"] = "abort"\n'
          new = '        existing_rustflags = env.get("RUSTFLAGS", "").strip()\n        unwind_dir = ndk / "sources" / "cxx-stl" / "llvm-libc++" / "libs" / "arm64-v8a"\n        unwind_library = unwind_dir / "libunwind.a"\n        if not unwind_library.exists():\n            raise SystemExit(f"Android NDK r21d ARM64 libunwind was not found: {unwind_library}")\n        env["RUSTFLAGS"] = f"{existing_rustflags} -C panic=abort -L native={unwind_dir}".strip()\n        env["TAFFY_UGUI_PANIC_STRATEGY"] = "abort"\n'
          if text.count(old) != 1:
              raise SystemExit(f"expected one Android panic block, found {text.count(old)}")
          text = text.replace(old, new)

          old = '    args.append(str(artifact))\n    return run(*args, capture=True, env=env)\n\n\ndef verify_symbols'
          new = '    args.append(str(artifact))\n    if spec.platform == "ios":\n        print("+", " ".join(str(arg) for arg in args), flush=True)\n        completed = subprocess.run(\n            args,\n            cwd=ROOT,\n            check=False,\n            env=env,\n            text=True,\n            stdout=subprocess.PIPE,\n            stderr=subprocess.STDOUT,\n        )\n        output = completed.stdout or ""\n        if completed.returncode != 0:\n            if output:\n                print(output, flush=True)\n            print(\n                f"Apple nm returned {completed.returncode} for the Rust iOS archive; validating required tu_* exports from emitted symbols.",\n                flush=True,\n            )\n        return output\n    return run(*args, capture=True, env=env)\n\n\ndef verify_symbols'
          if text.count(old) != 1:
              raise SystemExit(f"expected one generic nm return block, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Validate build driver
        run: |
          python -m py_compile build/build.py
          python scripts/phase4_static_preflight.py
          git diff --check
      - name: Commit platform verification fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/build.py
          git diff --cached --check
          git commit -m "Fix Android r21d and iOS Phase 4 verification"
          git push origin HEAD:main
