[package]
name = "taffy_ugui_native"
version = "1.1.2"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Native Taffy layout bridge for TaffyUGUI"
repository = "https://github.com/dofomii/TaffyUGUI"
publish = false

[lib]
name = "taffy_ugui"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
taffy = { version = "=0.13.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "float_layout", "calc", "content_size", "detailed_layout_info"] }

[[bench]]
name = "layout_scaling"
harness = false

[[bench]]
name = "allocation_profile"
harness = false

[[bench]]
name = "bulk_abi"
harness = false
