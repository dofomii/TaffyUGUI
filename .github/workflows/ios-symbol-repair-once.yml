name: ios-symbol-repair-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ios-symbol-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Use Rust-matched LLVM tools for iOS archives
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("build/build.py")
          text = path.read_text(encoding="utf-8")

          marker = 'def symbol_output(spec: TargetSpec, artifact: Path, env: dict[str, str]) -> str:\n'
          helper = '''def find_rust_llvm_tool(name: str) -> str:
              sysroot = Path(run("rustc", "--print", "sysroot", capture=True).strip())
              candidates = sorted(sysroot.glob(f"lib/rustlib/*/bin/{name}"))
              if current_os() == "windows":
                  candidates.extend(sorted(sysroot.glob(f"lib/rustlib/*/bin/{name}.exe")))
              if not candidates:
                  raise SystemExit(
                      f"Rust LLVM tool '{name}' was not found under {sysroot}. "
                      "Install the llvm-tools-preview component for the pinned toolchain."
                  )
              return str(candidates[0])


          def symbol_output(spec: TargetSpec, artifact: Path, env: dict[str, str]) -> str:
          '''.replace("          ", "")
          if text.count(marker) != 1:
              raise SystemExit(f"expected one symbol_output definition, found {text.count(marker)}")
          text = text.replace(marker, helper)

          start = text.index('    nm = require("nm")\n', text.index(marker))
          end_marker = '    return run(*args, capture=True, env=env)\n'
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''    if spec.platform == "ios":
              llvm_nm = find_rust_llvm_tool("llvm-nm")
              return run(llvm_nm, "-g", "--defined-only", str(artifact), capture=True, env=env)
              nm = require("nm")
              args = [nm]
              if spec.platform == "macos":
                  args += ["-gU"]
              else:
                  args += ["-g"]
              args.append(str(artifact))
              return run(*args, capture=True, env=env)
          '''.replace("          ", "")
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate build driver
        run: |
          python -m py_compile build/build.py
          python scripts/phase4_static_preflight.py
          git diff --check
      - name: Commit repaired iOS verifier
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/build.py
          git diff --cached --check
          git commit -m "Use Rust LLVM tools to verify iOS archive"
          git push origin HEAD:main
