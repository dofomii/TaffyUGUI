name: header-sync-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/header-sync-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Install pinned cbindgen
        run: cargo install cbindgen --version 0.29.2 --locked
      - name: Generate authoritative header
        run: python build/build.py header
      - name: Validate generated C11 and C++17 header surface
        run: python scripts/phase2_static_preflight.py
      - name: Commit synchronized header
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/taffy_ugui.h
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Header already synchronized."
            exit 0
          fi
          git commit -m "Regenerate authoritative C ABI header"
          git push origin HEAD:main
