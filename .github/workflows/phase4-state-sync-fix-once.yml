name: phase4-state-sync-fix-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase4-state-sync-fix-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Reuse validated synchronization script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/phase4-state-sync-once.yml').read_text(encoding='utf-8')
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'phase4-state-sync', 'exec'))

          tracker = Path('docs/TASK_TRACKER.md')
          lines = tracker.read_text(encoding='utf-8').splitlines()
          tracker.write_text('\n'.join(line.rstrip() for line in lines) + '\n', encoding='utf-8')
          PY
      - name: Validate and commit synchronized state
        shell: bash
        run: |
          git diff --check
          grep -q 'ABI-v1-RC' README.md
          grep -q 'Phase 3 gate — PASSED' docs/TASK_TRACKER.md
          grep -q 'Phase 4 gate — OPEN' docs/TASK_TRACKER.md
          grep -q 'ABI-v1-RC version handshake' docs/ABI_CANDIDATE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/TASK_TRACKER.md docs/ABI_CANDIDATE.md
          git diff --cached --check
          git commit -m "Synchronize project state at Phase 4 start"
          git push origin HEAD:main
