name: phase4-state-sync-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase4-state-sync-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Synchronize verified project state
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          def once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected one match, found {text.count(old)}")
              return text.replace(old, new)

          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          old = "**Active native engine development.** Phase 0 — Rust Project and Toolchain Foundation is complete. The formal tracker remains in **Phase 1 stabilization — Complete Rust/Taffy 0.13 Engine** because the mandatory Rust verification gate cannot run in the current detached environment. By explicit project-owner direction, the complete **Phase 2 production C ABI candidate implementation has also been prepared locally** without formally advancing the phase gate. User-facing Unity feature development remains intentionally gated until the native verification, cross-platform ABI release candidate, managed ABI conformance, final ABI v1 freeze, and native artifact rebuild are complete."
          new = "**Active native engine development.** Phases 0–3 are complete and verified. The Rust/Taffy 0.13 engine, production fixed-width C ABI, authoritative generated C/C++ header, golden/safety/lifecycle suites, host release builds, true Rust 1.82 MSRV lane, cbindgen drift check, and linked C11/C++17 smoke tests are green. The native interface is locked as **ABI-v1-RC (version 1, stage 1)** and **Phase 4 — Cross-Platform Native Compilation is active**. Windows x64, macOS universal, and iOS ARM64 native RC artifacts are verified in CI. Android ARM64 and WebGL remain active Phase 4 compatibility work. User-facing Unity feature development remains gated until managed ABI conformance freezes final ABI v1 and all native artifacts are rebuilt."
          s = once(s, old, new, "README status")
          s = once(s, "- current production `tu_*` ABI candidate reports version `0` while unfrozen; final ABI v1 is frozen only after managed conformance testing.", "- current production `tu_*` interface is **ABI-v1-RC**, version `1`, stage `1`; final ABI v1 is frozen only after managed conformance testing in Phase 6.", "README ABI")
          p.write_text(s, encoding="utf-8")

          p = Path("docs/TASK_TRACKER.md")
          s = p.read_text(encoding="utf-8")
          current = "\n".join([
              "# 3. Current state", "",
              "**Current phase:** Phase 4 — Cross-Platform Native Compilation (ABI RC)  ",
              "**Phase state:** IN PROGRESS  ",
              "**Current dependency baseline:** Taffy `0.13.0` exact pin  ",
              "**Project MSRV:** Rust `1.82.0`  ",
              "**Pinned normal/release toolchain:** Rust `1.97.1`  ",
              "**Native ABI:** **ABI-v1-RC — version `1`, stage `1`**  ",
              "**Phase 3 evidence:** canonical `python build/build.py verify-abi-rc`, Linux/Windows/macOS host lanes, true Rust 1.82 MSRV, generated-header diff, and linked C11/C++17 smoke tests are green.  ",
              "**Verified Phase 4 native targets:** Windows x64, macOS arm64/x64 + universal, iOS ARM64.  ",
              "**Active Phase 4 blockers:** Android ARM64 Rust 1.97 / Unity NDK r21d unwind compatibility; WebGL Rust 1.97/LLVM 22 / Unity Emscripten 2.0.19 compatibility.  ",
              "**Unity feature development:** PAUSED until Phase 6 managed ABI conformance, final ABI v1 freeze, and final native rebuild.  ",
              "**NEXT TASK:** **Resolve P4.9 Android ARM64 without inventing or silently substituting an unverified runtime; then resolve P4.13 WebGL against the pinned Unity toolchain.**", "",
              "### Pre-development decisions now closed",
          ])
          s, n = re.subn(r"# 3\. Current state\n\n.*?\n\n### Pre-development decisions now closed", current, s, count=1, flags=re.DOTALL)
          if n != 1:
              raise SystemExit(f"current-state block: {n}")

          rows = {
              "| 1 | Complete Rust/Taffy Engine | Full intended Taffy 0.13 native layout surface works without Unity | **IN PROGRESS** |": "| 1 | Complete Rust/Taffy Engine | Full intended Taffy 0.13 native layout surface works without Unity | **COMPLETE** |",
              "| 2 | Production C ABI Candidate | Safe fixed-width C ABI exposes the complete native engine | NOT STARTED |": "| 2 | Production C ABI Candidate | Safe fixed-width C ABI exposes the complete native engine | **COMPLETE** |",
              "| 3 | Native Verification + ABI RC | Golden/safety/header/smoke tests prove an ABI release candidate | NOT STARTED |": "| 3 | Native Verification + ABI RC | Golden/safety/header/smoke tests prove an ABI release candidate | **COMPLETE** |",
              "| 4 | Cross-Platform Native Compilation | ABI RC builds for Windows/macOS/Android/iOS/WebGL | NOT STARTED |": "| 4 | Cross-Platform Native Compilation | ABI RC builds for Windows/macOS/Android/iOS/WebGL | **IN PROGRESS** |",
          }
          for a, b in rows.items():
              s = once(s, a, b, "summary")

          gates = {
              1: "All intended native v1 Taffy features have deterministic native tests and execute without Unity.",
              2: "The complete engine is callable through the verified fixed-width `tu_*` C ABI and authoritative generated header.",
              3: "`python build/build.py verify-abi-rc` passes at ABI version/stage `1/1`, including golden/safety/lifecycle suites, generated-header drift verification, locked release build, and linked C11/C++17 smoke executables.",
          }
          for phase in (1, 2, 3):
              next_phase = phase + 1
              m = re.search(rf"(# Phase {phase} — .*?)(?=\n---\n\n# Phase {next_phase} —)", s, flags=re.DOTALL)
              if not m:
                  raise SystemExit(f"phase {phase} block not found")
              b = m.group(1)
              b = b.replace("**State:** IN PROGRESS", "**State:** COMPLETE", 1).replace("**State:** NOT STARTED", "**State:** COMPLETE", 1)
              b = re.sub(rf"- \[ \] \*\*P{phase}\.([0-9]+)(?: — NEXT TASK)?\*\*", rf"- [x] **P{phase}.\1**", b)
              if phase in (1, 2):
                  b = re.sub(rf"### Phase {phase} gate\n\n.*?$", f"### Phase {phase} gate — PASSED\n\n{gates[phase]}", b, flags=re.DOTALL)
              else:
                  b = b.rstrip() + f"\n\n### Phase 3 gate — PASSED\n\n{gates[3]}\n"
              s = s[:m.start(1)] + b + s[m.end(1):]

          s = once(s, "# Phase 4 — Cross-Platform Native Compilation (ABI RC)\n\n**State:** NOT STARTED", "# Phase 4 — Cross-Platform Native Compilation (ABI RC)\n\n**State:** IN PROGRESS", "phase4 state")
          for task in ("P4.1", "P4.2", "P4.3", "P4.4", "P4.5", "P4.6", "P4.7", "P4.8", "P4.11"):
              s, n = re.subn(rf"- \[ \] \*\*{re.escape(task)}\*\*", f"- [x] **{task}**", s, count=1)
              if n != 1:
                  raise SystemExit(f"task {task}: {n}")
          s = once(s, "- [ ] **P4.9** Android ARM64 `.so` using Unity 2021.3 NDK r21d.", "- [ ] **P4.9** Android ARM64 `.so` using Unity 2021.3 NDK r21d. — **BLOCKED:** the pinned Rust 1.97 Android target requires unwind compatibility not yet satisfied by the pinned r21d layout; resolve this without fabricating or silently substituting an unverified runtime.", "P4.9")
          s = once(s, "- [ ] **P4.13** WebGL static/linkage artifact using Unity 2021.3 bundled Emscripten 2.0.19.", "- [ ] **P4.13** WebGL static/linkage artifact using Unity 2021.3 bundled Emscripten 2.0.19. — **BLOCKED:** pinned Emscripten 2.0.19 cannot currently consume the Rust 1.97/LLVM 22 output; determine a Unity-compatible build path before claiming WebGL support.", "P4.13")
          s = once(s, "### Phase 4 gate\n\nEvery required platform-family artifact compiles with identical ABI RC symbols/version and passes host/static/link verification appropriate to that target.", "### Phase 4 gate — OPEN\n\nWindows x64, macOS arm64/x64 + universal, and iOS ARM64 compile, verify, and stage as CI artifacts with ABI-v1-RC. Android ARM64 and WebGL remain required open work, so Phase 4 is intentionally not complete yet.", "phase4 gate")
          p.write_text(s, encoding="utf-8")

          p = Path("docs/ABI_CANDIDATE.md")
          s = p.read_text(encoding="utf-8")
          intro = "\n".join([
              "This document describes the production C ABI implemented by `native/src/ffi.rs` and mirrored by the authoritative cbindgen output in `include/taffy_ugui.h`.", "",
              "The complete Phase 3 native verification gate has passed and the interface is locked as **ABI-v1-RC (version 1, stage 1)** for cross-platform native compilation. This is still not the final ABI v1 promise: Phase 6 managed conformance must prove the P/Invoke binary contract before final ABI v1 is frozen and every native artifact is rebuilt.",
          ])
          s, n = re.subn(r"This document describes the \*\*Phase 2 ABI candidate\*\*.*?final binary contract\.", intro, s, count=1, flags=re.DOTALL)
          if n != 1:
              raise SystemExit(f"ABI intro: {n}")
          handshake = "\n".join([
              "## ABI-v1-RC version handshake", "",
              "`tu_get_abi_version()` reports `1` and `tu_get_abi_stage()` reports `1`, identifying the verified **ABI-v1-RC** contract used by Phase 4 platform builds. Callers must also inspect `tu_get_capabilities()` before assuming an optional feature is available.", "",
              "The RC lock means all Phase 4 artifacts must expose this same binary contract. Final ABI v1 remains owned by Phase 6 managed conformance and the subsequent full native rebuild.",
          ])
          s, n = re.subn(r"## Candidate version handshake\n\n.*?managed-conformance freeze\.", handshake, s, count=1, flags=re.DOTALL)
          if n != 1:
              raise SystemExit(f"ABI handshake: {n}")
          old_header = "The checked-in `include/taffy_ugui.h` in this local Phase 2 work is a manually synchronized candidate mirror because this execution environment has no `cbindgen`. It is compiled as both C11 and C++17 by the static preflight. It must be regenerated with cbindgen and diff-checked in a Rust/cbindgen-enabled environment before P2.13 can be marked verified."
          new_header = "The checked-in `include/taffy_ugui.h` is authoritative cbindgen output. CI installs pinned cbindgen `0.29.2`, regenerates the header, fails on drift, and compiles the consumer surface as both C11 and C++17 before the ABI-RC gate can pass."
          s = once(s, old_header, new_header, "ABI header")
          p.write_text(s, encoding="utf-8")
          PY
      - name: Validate synchronized state
        run: |
          git diff --check
          grep -q 'ABI-v1-RC' README.md
          grep -q 'Phase 3 gate — PASSED' docs/TASK_TRACKER.md
          grep -q 'Phase 4 gate — OPEN' docs/TASK_TRACKER.md
          grep -q 'ABI-v1-RC version handshake' docs/ABI_CANDIDATE.md
      - name: Commit synchronized state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/TASK_TRACKER.md docs/ABI_CANDIDATE.md
          git diff --cached --check
          git commit -m "Synchronize project state at Phase 4 start"
          git push origin HEAD:main
