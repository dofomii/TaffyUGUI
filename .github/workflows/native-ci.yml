name: native-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Canonical quality driver
        if: matrix.os == 'ubuntu-latest'
        run: python build/build.py quality
      - name: Clippy
        if: matrix.os != 'ubuntu-latest'
        run: cargo clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --locked --manifest-path native/Cargo.toml
      - name: Release build
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --locked --manifest-path native/Cargo.toml --release

  msrv:
    name: rust (MSRV 1.82.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
      - name: Check MSRV
        run: cargo check --locked --manifest-path native/Cargo.toml --all-targets
      - name: Test MSRV
        run: cargo test --locked --manifest-path native/Cargo.toml
